name = "research-report"
description = "Research a question from a goal; an orchestrator, builders and reviewers share the board and deliver a cited report"
project = true

[hooks]
prepare = "hooks/prepare.py"
export = "hooks/export.py"
evaluate = "hooks/evaluate.py"

[messages]
task_brief = "prompts/task_brief.txt"
idle = "prompts/idle.txt"
idle_delivery = "prompts/idle_delivery.txt"
agents = "prompts/agents.txt"
lifecycle = "prompts/lifecycle"

[team]
issue_title = "{task}: research goal"
board_id = "team"
channel = "team-task"
wake_stagger = "5s"
event_context = "inline"
mcp_servers = ["board"]
board_types = ["FACT", "OBSERVED", "FAIL", "TASK", "DONE", "KEY", "VERIFIED", "CHALLENGE", "ALTERNATIVE", "REPORT"]
report_check = "checks/lint.py"

[environment]
network = "open"
task_prompts = "run"
model_route = true
subagents = true

[workspace]
import_history = true

[coordination]
backlog = "board"
task_wakeups = true

[lifecycle]
resumable = true
stop_when = ["budget", "tokens"]
finalize_notice = "15m"
evaluate_with_services = true
